<script>
  // 解密函数
  function decrypt(key, ciphertext) {
    const bytes = CryptoJS.AES.decrypt(ciphertext, key);
    const originalText = bytes.toString(CryptoJS.enc.Utf8);
    return originalText;
  }

  // 发起 GitHub API 请求获取文件列表
  async function fetchFileList(owner, repo, path, decryptedKey) {
    try {
      const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        method: 'GET',
        headers: {
          'Authorization': decryptedKey
        }
      });
      if (!response.ok) {
        throw new Error(`获取文件列表时出错，状态码: ${response.status}`);
      }
      return await response.json();
    } catch (error) {
      console.log('获取文件列表时出错:', error);
      throw error;
    }
  }

  // 发起请求获取单个文件内容
  async function fetchFileContent(url, decryptedKey) {
    try {
      const response = await fetch(url, {
        method: 'GET',
        headers: {
          'Authorization': decryptedKey
        }
      });
      if (!response.ok) {
        throw new Error(`请求文件内容时出错，状态码: ${response.status}`);
      }
      return await response.json();
    } catch (error) {
      console.log('请求文件内容时出错:', error);
      throw error;
    }
  }

  // 解析文件内容
  function parseFileContent(content) {
    const base64Content = content.content;
    const binaryString = atob(base64Content);
    const len = binaryString.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    const decoder = new TextDecoder('utf-8');
    const decodedContent = decoder.decode(bytes);
    const lines = decodedContent.trim().split('\n');
    const data = {};
    lines.forEach(line => {
      const [key, value] = line.split('=', 2);
      try {
        data[key] = JSON.parse(value);
      } catch (error) {
        data[key] = value;
      }
    });
    return data;
  }

  // 主函数
  async function main() {
    // 定义仓库信息
    const owner = 'XuYTong97';
    const repo = 'XuYTong97.github.io';
    const path = 'TeamsFiles';
    // 存储 a 标签的 title 属性值
    let teachers = [];
    let phD = [];
    let MEng = [];
    // 加密使用的密钥（AES 要求密钥长度为 16、24 或 32 字节）
    const encryptionKey = "1234567890123456";
    // 加密密钥
    const encryptedKey = "U2FsdGVkX19n7LHjbF+A4OTju6qpdurUCeF7Zn/Ocdkq5N0bEkL0LDf/lDdT1iQq+64NofY1t/igOtD6OQSqD8lmnhdYW9nQaoPENaGeBsxhe+bcsKjfUXuwz6K9WtdxN1qnYLBXOF9gazL+IGtJ/2LegrU8hN85RRCV3ST4mdE=";
    console.log("加密后的密钥: ", encryptedKey);

    // 解密密钥
    const decryptedKey = decrypt(encryptionKey, encryptedKey);
    console.log("解密后的密钥: ", decryptedKey);

    try {
      const fileList = await fetchFileList(owner, repo, path, decryptedKey);
      const requests = fileList.map(async (item) => {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}/${item.name}`;
        const content = await fetchFileContent(url, decryptedKey);
        const data = parseFileContent(content);
        if (data.Group && String(data.Group).includes("teacher")) {
          teachers.push(data);
          console.log(teachers)
        } else if (data.Group && String(data.Group).includes("M.Eng Student")) {
          MEng.push(data);
          console.log(MEng)
        } else if (data.Group && String(data.Group).includes("Ph.D Candidates")) {
          phD.push(data);
          console.log(phD)
        }
      });
      await Promise.all(requests);
      console.log('Teachers:', teachers);
      console.log('MEng:', MEng);
      console.log('PhD:', phD);
      teachers.forEach(item => {
        let DepartmentAndHonors = ""
        item.DepartmentAndHonors.forEach(key => {
          DepartmentAndHonors = DepartmentAndHonors + `<h4 style="text-align: justify; font-size: 1.02rem; margin-bottom: 0.57rem; margin-top: 0.2rem;">
          ${key}
         </h4>`
        })
        let txtstr = `<div class="team_center">
          <div class="team_center_top">
            <div class="avg">
              <img src="./img/${item.img}" alt="" />
            </div>
            <div class="text">
              <h3>${item.jobTitle} ${item.name}</h3>
              ${DepartmentAndHonors}
            </div>
          </div>
          <div class="team_center_bottom" style="margin-top: 0.6rem;">
          ${item.intr}
          </div>
        </div>`
        // 获取 class 为 team_wrap 的元素
        const teamWrap = document.querySelector('.team_wrap');
        // 获取第一个 div 节点
        const firstDiv = teamWrap.querySelector('div');
        // 创建一个新的 div 节点

        const newDiv = document.createElement('div');
        newDiv.innerHTML = txtstr;
        // 在第一个 div 节点之后插入新节点
        teamWrap.insertBefore(newDiv, firstDiv.nextSibling);
      })
      // 获取 class 为 team_ph 的元素
      const teamWrap = document.querySelector('.team_ph');
      const ul = teamWrap.querySelector('ul');
      let ultxtstr = ""
      phD.forEach(item => {
        ultxtstr = ultxtstr + `<li>
          <div class="avg">
            <img src="./img/${item.img}" alt="" />
          </div>
          <h3>${item.name}</h3>
          <p>
            ${item.intr}
          </p>
        </li>`
      })
      console.log(ultxtstr)
      ul.innerHTML = ultxtstr;

      // 获取 class 为 team_ph 的元素
      const team_student = document.querySelector('.team_student');
      const ulteam_student = team_student.querySelector('ul');
      let ulteam_student_txtstr = ""
      MEng.forEach(item => {
        ulteam_student_txtstr = ulteam_student_txtstr + `<li>
          <div class="avg">
            <img src="./img/${item.img}" alt="" />
          </div>
          <h3>${item.name}</h3>
          <p>
            ${item.intr}
          </p>
        </li>`
      })
      console.log(ulteam_student_txtstr)
      ulteam_student.innerHTML = ulteam_student_txtstr;

    } catch (error) {
      console.log('处理过程中出错:', error);
    }
  }

  main();



</script>
