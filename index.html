<script>
  // 定义仓库信息
  const owner = 'XuYTong97';
  const repo = 'XuYTong97.github.io';
  const path = 'indexFiles';
  // 加密使用的密钥（AES 要求密钥长度为 16、24 或 32 字节）
  const encryptionKey = "1234567890123456";
  // 加密密钥
  const encryptedKey = "U2FsdGVkX19n7LHjbF+A4OTju6qpdurUCeF7Zn/Ocdkq5N0bEkL0LDf/lDdT1iQq+64NofY1t/igOtD6OQSqD8lmnhdYW9nQaoPENaGeBsxhe+bcsKjfUXuwz6K9WtdxN1qnYLBXOF9gazL+IGtJ/2LegrU8hN85RRCV3ST4mdE=";
  console.log("加密后的密钥: ", encryptedKey);

  // 解密函数
  function decrypt(key, ciphertext) {
    const bytes = CryptoJS.AES.decrypt(ciphertext, key);
    const originalText = bytes.toString(CryptoJS.enc.Utf8);
    return originalText;
  }

  // 解密密钥
  const decryptedKey = decrypt(encryptionKey, encryptedKey);
  console.log("解密后的密钥: ", decryptedKey);
  // 发起请求获取单个文件内容
  async function fetchFileContent(url, decryptedKey) {
    try {
      const response = await fetch(url, {
        method: 'GET',
        headers: {
          'Authorization': decryptedKey
        }
      });
      if (!response.ok) {
        throw new Error(`请求文件内容时出错，状态码: ${response.status}`);
      }
      return await response.json();
    } catch (error) {
      console.log('请求文件内容时出错:', error);
      throw error;
    }
  }

  // 解析文件内容
  function parseFileContent(content) {
    const base64Content = content.content;
    const binaryString = atob(base64Content);
    const len = binaryString.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    const decoder = new TextDecoder('utf-8');
    const decodedContent = decoder.decode(bytes);
    const lines = decodedContent.trim().split('\n');
    return lines;
  }

    // 解析文件内容
    function parseFileContentUS(content) {
      const base64Content = content.content;
      const binaryString = atob(base64Content);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      const decoder = new TextDecoder('utf-8');
      const decodedContent = decoder.decode(bytes);
      return decodedContent;
    }


  async function main() {
    let contents = []

      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}/imglist.txt`;
      const content = await fetchFileContent(url, decryptedKey);
      const data = parseFileContent(content);
    console.log('contents:', data);

    // 定义轮播图路径数组
    const slidePaths = data

    // 获取轮播图容器元素
    const swiperWrapper = document.querySelector('.swiper-wrapper');

    // 循环遍历数组并创建幻灯片元素
    slidePaths.forEach((path) => {
      const slide = document.createElement('div');
      slide.classList.add('swiper-slide');
      const img = document.createElement('a');
      img.href = '#';
      const imgElement = document.createElement('img');
      imgElement.src = path;
      imgElement.alt = '';
      imgElement.style.transform = 'translateX(10px)';
      img.appendChild(imgElement);
      slide.appendChild(img);
      swiperWrapper.appendChild(slide);
    });

    // 初始化Swiper
    const swiper = new Swiper('.swiper-container', {
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
      pagination: {
        el: '.swiper-pagination',
      },
    });


    const urlUS = `https://api.github.com/repos/${owner}/${repo}/contents/${path}/AboutUS.md`;
    const contentUS = await fetchFileContent(urlUS, decryptedKey);
    const dataUS = parseFileContentUS(contentUS);
    console.log('contents:', dataUS);

    const contentContainer = document.getElementById('intro_left');
    // 清空之前的内容

    const div = document.createElement('div');

    // 假设 editormd 已经在页面中正确引入

    });
