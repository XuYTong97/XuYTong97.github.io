<script type="text/javascript">
    // 定义仓库信息
    const owner = 'XuYTong97';
    const repo = 'XuYTong97.github.io';
    const path = 'NewsFiles';
    // 存储 a 标签的 title 属性值
    let titles = [];
    let newsId;

    // 发起 GitHub API 请求获取文件列表
    $.ajax({
        url: `https://api.github.com/repos/${owner}/${repo}/contents/${path}`,
        type: 'GET',
        headers: {
            // 如果你有 GitHub token，可以在这里添加以避免请求限制
            'Authorization': 'Bearer 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'
        },
        success: function (response) {
            // 处理成功响应
            console.log(response);
            // 存储文件名
            response.forEach(item => {
                titles.push(item.name);
                console.log(item.url)
            });

            console.log('文件名数组:', titles);
            // 过滤出以.md为后缀的文件名
            const mdFileNames = titles.filter(fileName => fileName.endsWith('.md'));

            // 对过滤后的数组进行排序
            const sortedMdFileNames = mdFileNames.sort();

            console.log(sortedMdFileNames);

            // 获取当前URL的查询参数部分
            const urlParams = new URLSearchParams(window.location.search);
            // 获取参数id的值
            const idValue = urlParams.get('id');
            if (idValue) {
                console.log('参数id的值为:', idValue);
                newsId = idValue;
            } else {
                console.log('URL中未找到参数id');
                newsId = sortedMdFileNames[0].split(".")[0];
            }
            console.log(newsId);


            const xhr = new XMLHttpRequest();
            const url = `https://api.github.com/repos/XuYTong97/XuYTong97.github.io/contents/NewsFiles/${newsId}.md`;
            xhr.open('GET', url, true);
            xhr.send();

            xhr.onreadystatechange = function () {
                if (this.readyState === 4 && this.status === 200) {
                    const response = JSON.parse(this.responseText);
                    const base64Content = response.content;
                    // 将Base64字符串解码为Uint8Array
                    const binaryString = atob(base64Content);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    // 使用TextDecoder将Uint8Array转换为正确编码的字符串
                    const decoder = new TextDecoder('utf-8');
                    const decodedContent = decoder.decode(bytes);
                    console.log('解码后的内容:', decodedContent);
                    // 假设 editormd 已经在页面中正确引入
                    testEditormdView = editormd.markdownToHTML("test-editormd-view", {
                        markdown: decodedContent,
                        tocm: true,
                        emoji: true,
                        taskList: true,
                        tex: true
                    });
                    const editormdView = document.getElementById('test-editormd-view');

                    const firstH1 = editormdView.querySelector('h1');
                    if (firstH1) {
                        firstH1.style.textAlign = 'center';
                    }

                    const firstH3 = editormdView.querySelector('h3');
                    if (firstH3) {
                        firstH3.style.textAlign = 'center';
                    }

                    const paragraphs = editormdView.querySelectorAll('p');
                    paragraphs.forEach((paragraph) => {
                        if (paragraph !== firstH1 && paragraph !== firstH3) {
                            paragraph.style.textAlign = 'justify';
                            paragraph.style.textIndent = '2ch';
                        }
                    });
                }
            };
        },
        error: function (error) {
            // 处理错误
            console.log('获取文件列表时出错:', error);
        }
    });



</script>
