<script type="text/javascript">
    const titles = [];
    let newsId = ""
    $.get("https://github.com/XuYTong97/XuYTong97.github.io/tree/master/NewsFiles", function (response) {
        console.log(response)
        // 创建一个临时的 DOM 元素
        const tempDiv = $('<div></div>');
        // 将响应的 HTML 字符串插入到临时元素中
        tempDiv.html(response);
        // 查找 id 为 files 的 ul 元素
        const filesUl = tempDiv.find('#files');
        if (filesUl.length > 0) {
            // 查找 ul 下所有 li 标签内的 a 标签
            const aTags = filesUl.find('li a');
            // 存储 a 标签的 title 属性值
            aTags.each(function () {
                const title = $(this).attr('title');
                if (title) {
                    titles.push(title);
                }
            });
            console.log('a 标签的 title 属性值数组:', titles);
            // 过滤出以.md为后缀的文件名
            const mdFileNames = titles.filter(fileName => fileName.endsWith('.md'));

            // 对过滤后的数组进行排序
            const sortedMdFileNames = mdFileNames.sort();

            console.log(sortedMdFileNames);

            // 获取当前URL的查询参数部分
            const urlParams = new URLSearchParams(window.location.search);
            // 获取参数id的值
            const idValue = urlParams.get('id');
            if (idValue) {
                console.log('参数id的值为:', idValue);
                newsId = idValue
            } else {
                console.log('URL中未找到参数id');
                newsId = sortedMdFileNames[0].split(".")[0]
            }
            console.log(newsId)
            $.get("./News/" + newsId + ".md", function (markdown) {
                console.log(markdown)
                testEditormdView = editormd.markdownToHTML("test-editormd-view", {
                    markdown: markdown,//+ "\r\n" + $("#append-test").text(),
                    tocm: true,    // Using [TOCM]
                    emoji: true,
                    taskList: true,
                    tex: true,  // 默认不解析
                });
                const editormdView = document.getElementById('test-editormd-view');

                const firstH1 = editormdView.querySelector('h1');
                if (firstH1) {
                    firstH1.style.textAlign = 'center';
                }

                const firstH3 = editormdView.querySelector('h3');
                if (firstH3) {
                    firstH3.style.textAlign = 'center';
                }

                const paragraphs = editormdView.querySelectorAll('p');
                paragraphs.forEach((paragraph) => {
                    if (paragraph !== firstH1 && paragraph !== firstH3) {
                        paragraph.style.textAlign = 'justify';
                        paragraph.style.textIndent = '2ch';
                    }
                });
            });


        } else {
            console.log('未找到 id 为 files 的 ul 元素');
        }
    }).fail(function (error) {
        console.error('请求出错:', error);
    });



</script>
