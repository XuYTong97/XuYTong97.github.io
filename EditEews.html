<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线MarkDown编辑器</title>
  <link rel="stylesheet" href="./editormd/css/editormd.min.css">
  <script src="./editormd/editormd.min.js"></script>
  <script src="http://libs.baidu.com/jquery/1.10.2/jquery.min.js" rel="external nofollow"></script>
  <link rel="stylesheet" href="editormd/css/editormd.preview.css" />

</head>
<style>
  .news {
    background-color: cornflowerblue;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: aliceblue;
    font-size: 25px;
  }
</style>

<body>
  <div class="news">在线MarkDown编辑</div>
  <div class="field">
    <div id="md-content" style="z-index: 1 !important;">
      <textarea placeholder="内容" content="content" style="display: none"></textarea>
    </div>
  </div>

</body>
<script src="./editormd/editormd.js"></script>
<script src="./editormd/lib/marked.min.js"></script>
<script src="./editormd/lib/prettify.min.js"></script>
<script>
  //初始化Markdown编辑器
  var contentEditor;
  $(function () {
    contentEditor = editormd("md-content", {
      width: "100%",
      height: 640,
      syncScrolling: "single",
      path: "./editormd/lib/"
    });

    /*
    // or
    testEditor = editormd({
        id      : "test-editormd",
        width   : "90%",
        height  : 640,
        path    : "../lib/"
    });
    */
  });
</script>

</html>
