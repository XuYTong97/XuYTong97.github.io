<script>
  // 定义仓库信息
  const owner = 'XuYTong97';
  const repo = 'XuYTong97.github.io';
  const path = 'PublicationsFiles';
  // 加密使用的密钥（AES 要求密钥长度为 16、24 或 32 字节）
  const encryptionKey = "1234567890123456";
  // 加密密钥
  const encryptedKey = "U2FsdGVkX19n7LHjbF+A4OTju6qpdurUCeF7Zn/Ocdkq5N0bEkL0LDf/lDdT1iQq+64NofY1t/igOtD6OQSqD8lmnhdYW9nQaoPENaGeBsxhe+bcsKjfUXuwz6K9WtdxN1qnYLBXOF9gazL+IGtJ/2LegrU8hN85RRCV3ST4mdE=";
  console.log("加密后的密钥: ", encryptedKey);

  // 解密函数
  function decrypt(key, ciphertext) {
    const bytes = CryptoJS.AES.decrypt(ciphertext, key);
    const originalText = bytes.toString(CryptoJS.enc.Utf8);
    return originalText;
  }

  // 解密密钥
  const decryptedKey = decrypt(encryptionKey, encryptedKey);
  console.log("解密后的密钥: ", decryptedKey);
  // 发起请求获取单个文件内容
  async function fetchFileContent(url, decryptedKey) {
    try {
      const response = await fetch(url, {
        method: 'GET',
        headers: {
          'Authorization': decryptedKey
        }
      });
      if (!response.ok) {
        throw new Error(`请求文件内容时出错，状态码: ${response.status}`);
      }
      return await response.json();
    } catch (error) {
      console.log('请求文件内容时出错:', error);
      throw error;
    }
  }

  // 解析文件内容
  function parseFileContent(content, item) {
    const base64Content = content.content;
    const binaryString = atob(base64Content);
    const len = binaryString.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    const decoder = new TextDecoder('utf-8');
    const decodedContent = decoder.decode(bytes);
    return decodedContent;
  }

  // 发起 GitHub API 请求获取文件列表
  async function fetchFileList(owner, repo, path, decryptedKey) {
    try {
      const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        method: 'GET',
        headers: {
          'Authorization': decryptedKey
        }
      });
      if (!response.ok) {
        throw new Error(`获取文件列表时出错，状态码: ${response.status}`);
      }
      return await response.json();
    } catch (error) {
      console.log('获取文件列表时出错:', error);
      throw error;
    }
  }

  async function main() {
    let contents = []
    const fileList = await fetchFileList(owner, repo, path, decryptedKey);
    const requests = fileList.map(async (item) => {
      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}/${item.name}`;
      const content = await fetchFileContent(url, decryptedKey);
      const data = parseFileContent(content);
      contents.push(data)
    });
    await Promise.all(requests);
    console.log('contents:', contents);

    const contentContainer = document.getElementById('content-container');
    // 清空之前的内容
    contentContainer.innerHTML = '';

    contents.forEach((content, index) => {
      const div = document.createElement('div');
      div.id = `test-editormd-view-${index}`;
      div.innerHTML = `<textarea style="display:none;" name="test-editormd-markdown-doc"></textarea>`;
      contentContainer.appendChild(div);

      // 假设 editormd 已经在页面中正确引入
      editormd.markdownToHTML(`test-editormd-view-${index}`, {
        markdown: content,
        tocm: true,
        emoji: true,
        taskList: true,
        tex: true
      });
    });
  }
  main()
</script>
